services:

  api:
    build: .
    container_name: medical-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./results/gradcam_api:/app/results/gradcam_api

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

  frontend:
    build: .
    container_name: medical-frontend

    ports:
      - "8501:8501"

    environment:
      API_URL: "http://api:8000"

    depends_on:
      - api

    command:
      [
        "streamlit",
        "run",
        "frontend/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501"
      ]